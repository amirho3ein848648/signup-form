<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="icon"  href="./photos/image.png">
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <form action="#" class="form">
      <img class="logo-img" src="./photos/image.png" alt="logo-img" />
      <h3 class="Welcome-part">Welcome back</h3>
      <p class="request-text">please enter your details to sign in</p>
      <div class="icons-container">
        <div class="icons"><img src="./photos/image 1.png" alt="apple logo" /></div>
        <div class="icons"><img src="./photos/image 2.png" alt="google logo" /></div>
        <div class="icons"><img src="./photos/image 3.png" alt="in logo" /></div>
      </div>
      <div class="divider">
        <span></span>
        <p>OR</p>
        <span></span>
      </div>
      <div class="iputs">
        <div class="input1">
        <label for="E-Mail">E-Mail Address </label>
        <input class="E-P_input" type="email" id="E-Mail" placeholder="Enter your email... " required />
        </div>
        <div class="input2">
        <label  for="P">Password</label>
        <input class="E-P_input" type="password" id="P" placeholder="password@123" required />
        </div>
      </div>
      <div class="checkbox-container">
        <input class="C-INPUT" type="checkbox" id="C"/>
        <label for="C">Remember me</label>
        <a class="Forgot" href="#">Forgot password?</a>
      </div>
      <div class="sign-in"><button class="sign-in-btn">sign in</button></div>
      <div class="sign-up"><p class="sign-up-p">Don’t have an account yet?</p><a href="#" class="sign-up-a">Sign up</a></div>
    </form>
  </body>
</html>
